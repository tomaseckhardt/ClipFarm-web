# Sestaví web a nasadí ho na GitHub Pages při každém pushi do main a při každém novém vydání ClipFarmu (repository_dispatch z repa ClipFarm)
# (ručně: Actions → Nasazení na GitHub Pages → Run workflow). Changelog a údaje o instalačce bere z nejnovějšího vydání.
# Jednou nastavit: Settings → Pages → Source: GitHub Actions.
name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch: # nová verze ClipFarmu: workflow „ClipFarm .exe“ v repu ClipFarm sem nahraje vydání a pošle tohle
    types: [nove-vydani]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - name: Changelog a instalačka z nejnovějšího vydání
        run: node scripts/fetch-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true # .nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
